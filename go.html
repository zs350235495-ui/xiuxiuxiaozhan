<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在安全跳转 ~ 咻咻小站</title>
  <style>
    :root {
      --primary: #FF8EA7;
      --primary-dark: #FF6B8B;
      --bg: #FFF5F7;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-pink: #FFD6E0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-main);
      padding: 20px;
    }
    .redirect-card {
      text-align: center;
      padding: 36px 32px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(255, 142, 167, 0.2);
      max-width: 460px;
      width: 100%;
      border: 2px dashed var(--border-pink);
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .icon {
      font-size: 2.8rem;
      margin-bottom: 12px;
      display: inline-block;
      animation: bounce 1.8s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #FFFFFF;
      text-decoration: none;
      padding: 12px 32px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.98rem;
      box-shadow: 0 6px 20px rgba(255, 107, 139, 0.38);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 107, 139, 0.5);
    }
    .meta-note {
      font-size: 0.78rem;
      color: #94A3B8;
      margin-top: 18px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 142, 167, 0.3);
      border-top-color: var(--primary-dark);
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

</body>
</html>
